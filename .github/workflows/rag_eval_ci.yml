name: MineMind RAG Quality & Latency CI Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rag-evaluation-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rank-bm25 qdrant-client sentence-transformers pypdf fastapi uvicorn pydantic arize-phoenix deepeval ragas

      - name: Ingest Mining Regulatory Corpus
        run: |
          python scripts/ingest_docs.py

      - name: Run CI Quality & SLA Latency Benchmark Gate
        run: |
          python scripts/run_eval_ci.py

name: MineMind RAG Quality & Latency CI Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rag-evaluation-gate:
    name: Phase 2 RAG Latency & Quality SLA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI Citation Grounding & Passage Precision Gate
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/scrape_msha_accidents.py
          python scripts/run_grounding_eval_ci.py
